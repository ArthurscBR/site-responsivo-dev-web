<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css">
    <title>site-responsivo-dev-web</title>
  </head>
  <body>
      <nav class="navbar">
        <a href="index.html"><img src="src/assets/Logo-Playverse.png" alt=""></a>
        <div class="menus">
          <ul>
            <li><a href="about.html">Sobre</a></li>
            <li><a href="login.html">Login</a></li>
          </ul>
        </div>
      </nav>

      <main>
        <!-- Seção de Destaque -->
        <section class="hero">
          <div class="hero-content">
            <h2>Cyberpunk 2077</h2>
            <p>A cidade não dorme. Compre agora com 50% de desconto!</p>
            <button class="btn-comprar">Jogar Agora</button>
          </div>
        </section>

        <!-- Galeria de Jogos com CSS Grid -->
        <section class="jogos-container">
          <h3 class="titulo-secao">Destaques e Recomendações</h3>
          <div class="galeria-grid">
            <!-- Card 1 -->
            <div class="card-jogo">
              <img src="https://assets.nintendo.com/image/upload/ar_16:9,c_lpad,w_1240/b_white/f_auto/q_auto/store/software/switch2/70010000105851/8787627be7f26ae7984456ffd9af17bea845032cebbf59fe6eeb596dea6bb20e" alt="Capa do Jogo" class="capa-jogo-img">
              <div class="info-jogo">
                <h4>Hollow Knight</h4>
                <p class="preco">R$ 27,99</p>
                <button class="btn-card">Comprar</button>
              </div>
            </div>

            <!-- Card 2 -->
            <div class="card-jogo">
              <img src="https://i.ytimg.com/vi/JlAxhwysFkk/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLBpvf-FVfqY2Y3tMQl0nP1foqgy0Q" alt="Capa do Jogo" class="capa-jogo-img">
              <div class="info-jogo">
                <h4>Elden Ring</h4>
                <p class="preco">R$ 229,90</p>
                <button class="btn-card">Comprar</button>
              </div>
            </div>

            <!-- Card 3 -->
            <div class="card-jogo">
              <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSYruV8W3V02l0vCXIXvUgPgXgbVZKhX6WlitEG7H_qy3qPsjcYxuyMB98&s=10" alt="Capa do Jogo" class="capa-jogo-img">
              <div class="info-jogo">
                <h4>Stardew Valley</h4>
                <p class="preco">R$ 24,99</p>
                <button class="btn-card">Comprar</button>
              </div>
            </div>
          </div>
        </section>
      </main>
  </body>
</html>
